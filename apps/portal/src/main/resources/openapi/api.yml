openapi: 3.0.0
info:
  title: Portal API
  version: 1.0.0
  description: Portal service API

servers:
  - url: /api
    description: Served from current host

paths:
  /hello:
    get:
      operationId: getHello
      summary: Get hello world message
      tags:
        - Hello
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelloResponse"

components:
  schemas:
    HelloResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Hello world message
          example: "Hello World"
