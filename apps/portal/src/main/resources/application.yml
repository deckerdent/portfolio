server:
  port: 8080

spring:
  application:
    name: portal

  security:
    oauth2:
      client:
        registration: {}
      resourceserver:
        jwt:
          enabled: false

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/portal}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.reactive.ReactiveSecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.reactive.ReactiveUserDetailsServiceAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.security.reactive.ReactiveManagementWebSecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.resource.reactive.ReactiveOAuth2ResourceServerAutoConfiguration

  cache:
    type: none

  webflux:
    base-path: /

  web:
    resources:
      static-locations:
        - file:./static/
        - classpath:/static/

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      enabled: true
      show-details: when-authorized

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs

spa:
  # Requests whose path matches this pattern are passed through as-is (not rewritten to index.html).
  # Covers: API calls, actuator, and any path that ends with a file extension (static assets).
  passthrough-pattern: "^(/api|/actuator).*|.*\\.\\w+$"
  swagger-ui:
    enabled: true
    path: /swagger-ui
    disable-swagger-default-url: true
