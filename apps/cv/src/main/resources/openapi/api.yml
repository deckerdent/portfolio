    put:
      summary: Update experience by ID
      operationId: updateExperience
      tags: [Experience]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperienceRequest"
      responses:
        "200":
          description: Experience updated
