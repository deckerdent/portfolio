openapi: 3.0.3
info:
  title: CV API
  description: CV service REST API
  version: 1.0.0

servers:
  - url: /api
    description: Local development

tags:
  - name: GeneralInfo
  - name: Experience
  - name: Education
  - name: Skills
  - name: Competences
  - name: Languages
  - name: Hobbies
  - name: References
  - name: Certificates

paths:
  /cv/general-info:
    get:
      summary: Get general CV info
      operationId: getGeneralInfo
      tags: [GeneralInfo]
      responses:
        "200":
          description: General info found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneralInfoResponse"
        "404":
          description: No general info exists yet
    put:
      summary: Upsert general CV info
      operationId: upsertGeneralInfo
      tags: [GeneralInfo]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneralInfoRequest"
      responses:
        "200":
          description: General info updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneralInfoResponse"

  /cv/experiences:
    get:
      summary: List all professional experiences
      operationId: getExperiences
      tags: [Experience]
