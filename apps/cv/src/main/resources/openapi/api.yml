components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    # ── Enums ────────────────────────────────────────────────────────────────
    MaritalStatus:
      type: string
      enum:
        - SINGLE
        - MARRIED
        - DIVORCED
        - WIDOWED
        - SEPARATED

    # ── Shared base fields ──────────────────────────────────────────────────
    BaseResponse:
      type: object
      required: [id, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ── GeneralInfo ─────────────────────────────────────────────────────────
    GeneralInfoResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            firstName:
              type: string
            lastName:
              type: string
            maritalStatus:
              $ref: "#/components/schemas/MaritalStatus"
            numberOfChildren:
              type: integer
            dateOfBirth:
              type: string
              format: date
            placeOfBirth:
              type: string
            nationality:
              type: string
            imageUrl:
              type: string
            summary:
              type: string

    GeneralInfoRequest:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        maritalStatus:
          $ref: "#/components/schemas/MaritalStatus"
        numberOfChildren:
          type: integer
        dateOfBirth:
          type: string
          format: date
        placeOfBirth:
          type: string
        nationality:
          type: string
        imageUrl:
          type: string
        summary:
          type: string

    # ── Experience ──────────────────────────────────────────────────────────
    ExperienceResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          required: [title, companyName, startDate]
          properties:
            title:
              type: string
            companyName:
              type: string
            startDate:
              type: string
              format: date
            endDate:
              type: string
              format: date
              nullable: true
            location:
              type: string
            description:
              type: string
            skills:
              type: array
              items:
                type: string
            highlights:
              type: string

    ExperienceRequest:
      type: object
      required: [title, companyName, startDate]
      properties:
        title:
          type: string
        companyName:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
        location:
          type: string
        description:
          type: string
        skills:
          type: array
          items:
            type: string
        highlights:
          type: string

    # ── Education ───────────────────────────────────────────────────────────
    EducationResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          required: [title, schoolName, startDate]
          properties:
            title:
              type: string
            schoolName:
              type: string
            startDate:
              type: string
              format: date
            endDate:
              type: string
              format: date
              nullable: true
            location:
              type: string
            description:
              type: string

    EducationRequest:
      type: object
      required: [title, schoolName, startDate]
      properties:
        title:
          type: string
        schoolName:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
        location:
          type: string
        description:
          type: string

    # ── Skill ───────────────────────────────────────────────────────────────
    SkillResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          required: [title, level]
          properties:
            title:
              type: string
            level:
              type: integer
              minimum: 1
              maximum: 10

    SkillRequest:
      type: object
      required: [title, level]
      properties:
        title:
          type: string
        level:
          type: integer
          minimum: 1
          maximum: 10

    # ── Competence ──────────────────────────────────────────────────────────
    CompetenceResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          required: [description]
          properties:
            description:
              type: string

    CompetenceRequest:
      type: object
      required: [description]
      properties:
        description:
          type: string

    # ── Language ────────────────────────────────────────────────────────────
    LanguageResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          required: [name, level]
          properties:
            name:
              type: string
            level:
              type: integer
              minimum: 1
              maximum: 10

    LanguageRequest:
      type: object
      required: [name, level]
      properties:
        name:
          type: string
        level:
          type: integer
          minimum: 1
          maximum: 10

    # ── Hobby ───────────────────────────────────────────────────────────────
    HobbyResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          required: [name]
          properties:
            name:
              type: string

    HobbyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string

    # ── Reference ───────────────────────────────────────────────────────────
    ReferenceRelation:
      type: string
      enum:
        - COWORKER
        - MANAGER

    ReferenceResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          required: [firstName, lastName, description]
          properties:
            firstName:
              type: string
            lastName:
              type: string
            description:
              type: string
            relation:
              $ref: "#/components/schemas/ReferenceRelation"
              nullable: true

    ReferenceRequest:
      type: object
      required: [firstName, lastName, description]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        description:
          type: string
        relation:
          $ref: "#/components/schemas/ReferenceRelation"
          nullable: true

    # ── Certificate ─────────────────────────────────────────────────────────
    CertificateResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          required: [title, issuingOrganization, startDate]
          properties:
            title:
              type: string
            issuingOrganization:
              type: string
            startDate:
              type: string
              format: date
            endDate:
              type: string
              format: date
              nullable: true
            location:
              type: string
            description:
              type: string

    CertificateRequest:
      type: object
      required: [title, issuingOrganization, startDate]
      properties:
        title:
          type: string
        issuingOrganization:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
        location:
          type: string
        description:
          type: string
