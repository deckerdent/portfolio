<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Right image placeholder</title>
  <desc id="desc">Static placeholder image for right slot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5ecff"/>
      <stop offset="100%" stop-color="#ead9ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect x="80" y="80" width="1040" height="640" rx="24" fill="none" stroke="#8b5cf6" stroke-width="6" stroke-dasharray="18 14"/>
  <text x="600" y="390" font-family="Arial, sans-serif" font-size="56" text-anchor="middle" fill="#5b21b6">Image Placeholder 2</text>
  <text x="600" y="450" font-family="Arial, sans-serif" font-size="32" text-anchor="middle" fill="#7c3aed">/images/cv-static/placeholder-right.svg</text>
